[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is "naoh" (the PyPI project + GitHub repo). The import package
# stays `book_to_skill` and the CLI command stays `book-to-skill`.
[project]
name = "naoh"
version = "0.1.0"
description = "naoh / book-to-skill: turn a PDF/MD/DOCX book into a Claude Code skill. Skill mode (no API) + provider-agnostic API mode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "naoh" }]
keywords = ["claude", "claude-code", "skills", "agents", "pdf", "docx", "llm", "rag", "book"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/vinothhacks/naoh"
Repository = "https://github.com/vinothhacks/naoh"

[project.scripts]
book-to-skill = "book_to_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/book_to_skill"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/book_to_skill"]
branch = true
